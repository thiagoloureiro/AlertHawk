name: Publish Docker image

on:
  workflow_call:
    inputs:
      image_name:
        description: Docker Hub repository name under thiagoguaru
        required: true
        type: string
      context:
        description: Docker build context, relative to the repository root
        required: true
        type: string
      dockerfile:
        description: Dockerfile path, relative to the repository root
        required: true
        type: string
      test_project:
        description: Solution or test project to run before publishing
        required: true
        type: string
      version:
        description: Optional release version, for example 3.3.16
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ inputs.image_name }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ inputs.image_name }}-
            nuget-${{ runner.os }}-

      - name: Test
        run: dotnet test "${{ inputs.test_project }}" --configuration Release --verbosity minimal

  publish:
    name: Publish
    needs: test
    if: github.repository == 'thiagoloureiro/AlertHawk'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Container images are published only from main."
          exit 1

      - name: Resolve image tags
        id: meta
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$REQUESTED_VERSION" | tr -d '[:space:]')"
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 3.3.16 (got '${VERSION}')."
            exit 1
          fi

          IMAGE="thiagoguaru/${IMAGE_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "version=${VERSION}"
            echo "release_tag=${IMAGE_NAME}-${VERSION}"
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:sha-${SHORT_SHA}"
            if [[ -n "$VERSION" ]]; then
              echo "${IMAGE}:${VERSION}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/thiagoloureiro/AlertHawk
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}

      - name: Create GitHub release
        if: steps.meta.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          NOTES="$(cat <<EOF
          Published [\`thiagoguaru/${IMAGE_NAME}:${VERSION}\`](https://hub.docker.com/r/thiagoguaru/${IMAGE_NAME}/tags) to Docker Hub.

          Also tagged \`latest\` and \`sha-${GITHUB_SHA::7}\`.
          EOF
          )"
          TITLE="${IMAGE_NAME} ${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi
