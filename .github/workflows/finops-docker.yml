name: FinOps image

on:
  push:
    branches: [main]
    paths:
      - "AlertHawk.FinOps/**"
      - ".github/workflows/finops-docker.yml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 3.3.24). Leave empty to publish latest and the commit SHA only.
        required: false
        type: string

concurrency:
  group: finops-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image_name: alerthawk.finops.api
      context: AlertHawk.FinOps
      dockerfile: AlertHawk.FinOps/AlertHawk.FinOps/Dockerfile
      test_project: AlertHawk.FinOps/AlertHawk.FinOps.Tests/AlertHawk.FinOps.Tests.csproj
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
    secrets: inherit
