name: Metrics API image

on:
  push:
    branches: [main]
    paths:
      - "AlertHawk.Metrics/AlertHawk.Metrics.API/**"
      - "AlertHawk.Metrics/AlertHawk.Metrics.Tests/**"
      - "AlertHawk.Metrics/AlertHawk.Metrics.sln"
      - "AlertHawk.Metrics/.dockerignore"
      - ".github/workflows/metrics-api-docker.yml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 3.3.19). Leave empty to publish latest and the commit SHA only.
        required: false
        type: string

concurrency:
  group: metrics-api-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image_name: alerthawk.metrics.api
      context: AlertHawk.Metrics
      dockerfile: AlertHawk.Metrics/AlertHawk.Metrics.API/Dockerfile
      test_project: AlertHawk.Metrics/AlertHawk.Metrics.sln
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
    secrets: inherit
