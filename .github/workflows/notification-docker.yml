name: Notification image

on:
  push:
    branches: [main]
    paths:
      - "AlertHawk.Notification/**"
      - ".github/workflows/notification-docker.yml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 3.3.16). Leave empty to publish latest and the commit SHA only.
        required: false
        type: string

concurrency:
  group: notification-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image_name: alerthawk.notification
      context: AlertHawk.Notification
      dockerfile: AlertHawk.Notification/Dockerfile
      test_project: AlertHawk.Notification/AlertHawk.Notification.sln
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
    secrets: inherit
