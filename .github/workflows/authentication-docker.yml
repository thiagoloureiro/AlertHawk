name: Authentication image

on:
  push:
    branches: [main]
    paths:
      - "AlertHawk.Authentication/**"
      - ".github/workflows/authentication-docker.yml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 3.3.16). Leave empty to publish latest and the commit SHA only.
        required: false
        type: string

concurrency:
  group: authentication-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image_name: alerthawk.authentication
      context: AlertHawk.Authentication
      dockerfile: AlertHawk.Authentication/Dockerfile
      test_project: AlertHawk.Authentication/AlertHawk.Authentication.sln
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
    secrets: inherit
